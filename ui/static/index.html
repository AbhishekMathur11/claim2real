<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>claim2real</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="mark"><img src="/static/logo.jpg" alt="" /></div>
          <div class="word">
            <span class="name">claim2real</span>
            <span class="tag">Verified robotics sourcing</span>
          </div>
        </div>
        <nav id="stepper" class="stepper" aria-label="Progress"></nav>
      </div>
    </header>

    <main class="shell">
      <!-- 1 · Problem -->
      <section id="step-problem" class="step-panel">
        <div class="panel-head">
          <span class="step-no">01</span>
          <div>
            <h2>Problem statement</h2>
            <p class="sub">Describe the robot, the job and any constraints. We turn it into hardware and software requirements.</p>
          </div>
        </div>
        <form id="problem-form" class="composer" autocomplete="off">
          <label class="sr-only" for="problem-input">Problem statement</label>
          <textarea id="problem-input" rows="3" autocomplete="off" placeholder="e.g. A mobile robot that harvests bell peppers in a greenhouse; 2 kg payload, outdoor rated, under $40k" required></textarea>
          <button type="submit" id="generate-btn" class="btn primary"></button>
        </form>
        <div id="think" class="think" hidden>
          <canvas id="orb" width="40" height="40" aria-label="Working"></canvas>
          <span>Specifying hardware &amp; software</span>
        </div>
        <p id="error" class="error" hidden></p>
      </section>

      <!-- 2 · Requirements -->
      <section id="step-requirements" class="step-panel" hidden></section>
      <!-- 3 · Search -->
      <section id="step-search" class="step-panel" hidden></section>
      <!-- 4 · Verification + build vs buy -->
      <section id="step-verify" class="step-panel" hidden></section>
      <!-- 5 · Report & outreach -->
      <section id="step-outreach" class="step-panel" hidden></section>

      <details id="run-log" class="run-log" hidden>
        <summary>Run log</summary>
        <pre></pre>
      </details>
    </main>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
